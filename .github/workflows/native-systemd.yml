name: Native Linux systemd integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-linux-systemd-probe
  cancel-in-progress: false
jobs:
  native-systemd:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install .
      - name: Prepare disposable user manager session
        run: |
          runner_uid=$(id -u)
          sudo systemctl start "user@${runner_uid}.service"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$runner_uid" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$runner_uid" >> "$GITHUB_ENV"
          systemctl --version
      - name: Verify actual scheduled execution and cleanup
        run: python tools/live_systemd.py
