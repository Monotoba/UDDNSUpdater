name: Live DuckDNS integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-duckdns-test-record
  cancel-in-progress: false
jobs:
  live-duckdns:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live-test dependencies
        run: python -m pip install -r requirements.txt 'dnspython>=2.6,<3'
      - name: Update, verify, and restore disposable record
        env:
          DUCKDNS_TEST_TOKEN: ${{ secrets.DUCKDNS_TEST_TOKEN }}
          DUCKDNS_TEST_SUBDOMAIN: ${{ vars.DUCKDNS_TEST_SUBDOMAIN || 'monotoba-uddns-test' }}
        run: python tools/live_duckdns.py
